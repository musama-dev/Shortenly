<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <rect width="880" height="560" fill="#f8fafc"/>
  <rect x="0" y="0" width="880" height="64" fill="url(#hdr)"/>
  <text x="24" y="40" fill="#ffffff" font-size="22" font-weight="650">Shortenly — System Architecture</text>

  <!-- Client -->
  <rect x="40" y="110" width="200" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="140" y="145" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Browser / Client</text>
  <text x="140" y="172" text-anchor="middle" font-size="12" fill="#475569">React SPA (dashboard)</text>
  <text x="140" y="192" text-anchor="middle" font-size="12" fill="#475569">Visitor clicking a short link</text>

  <!-- Frontend build -->
  <rect x="340" y="110" width="220" height="120" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="145" text-anchor="middle" font-size="16" font-weight="600" fill="#1d4ed8">frontend/ (Vite + React)</text>
  <text x="450" y="172" text-anchor="middle" font-size="12" fill="#475569">Static build → dist/</text>
  <text x="450" y="192" text-anchor="middle" font-size="12" fill="#475569">Landing, Dashboard, QR codes</text>

  <!-- Backend -->
  <rect x="640" y="110" width="200" height="120" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="740" y="145" text-anchor="middle" font-size="16" font-weight="600" fill="#15803d">backend/ (Node)</text>
  <text x="740" y="172" text-anchor="middle" font-size="12" fill="#475569">server/index.mjs — http server</text>
  <text x="740" y="192" text-anchor="middle" font-size="12" fill="#475569">api/*.js — Vercel functions</text>

  <!-- Data -->
  <rect x="340" y="330" width="220" height="100" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="450" y="365" text-anchor="middle" font-size="16" font-weight="600" fill="#a16207">data/links.json</text>
  <text x="450" y="392" text-anchor="middle" font-size="12" fill="#475569">Shared link registry</text>
  <text x="450" y="412" text-anchor="middle" font-size="12" fill="#475569">+ api/links-seed.json (bundle fallback)</text>

  <!-- Arrows -->
  <line x1="240" y1="150" x2="334" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="287" y="140" text-anchor="middle" font-size="11" fill="#64748b">GET / (app shell)</text>

  <line x1="240" y1="190" x2="634" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="437" y="232" text-anchor="middle" font-size="11" fill="#64748b">POST /api/links · GET /alias (302)</text>

  <line x1="740" y1="230" x2="566" y2="345" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="690" y="300" text-anchor="middle" font-size="11" fill="#64748b">readLinks / writeLinks</text>

  <line x1="450" y1="230" x2="450" y2="324" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="462" y="282" font-size="11" fill="#64748b">seed import (build time)</text>

  <!-- Runtime hosts note -->
  <rect x="40" y="330" width="220" height="100" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="150" y="360" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Runs on 3 targets</text>
  <text x="150" y="384" text-anchor="middle" font-size="12" fill="#475569">Vite dev middleware (dev)</text>
  <text x="150" y="402" text-anchor="middle" font-size="12" fill="#475569">Node server (VPS)</text>
  <text x="150" y="420" text-anchor="middle" font-size="12" fill="#475569">Vercel functions (serverless)</text>

  <text x="440" y="500" text-anchor="middle" font-size="12" fill="#94a3b8">One shared store (data/links.json) keeps every runtime in sync.</text>
</svg>
