<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <rect width="880" height="560" fill="#f8fafc"/>
  <rect x="0" y="0" width="880" height="64" fill="url(#hdr)"/>
  <text x="440" y="41" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="650">Shortenly — System Architecture</text>

  <!-- Client -->
  <rect x="36" y="120" width="210" height="118" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="141" y="158" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">Browser / Client</text>
  <text x="141" y="186" text-anchor="middle" font-size="13" fill="#475569">React SPA (dashboard)</text>
  <text x="141" y="207" text-anchor="middle" font-size="13" fill="#475569">Visitor clicking a short link</text>

  <!-- Frontend build -->
  <rect x="330" y="120" width="220" height="118" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="440" y="158" text-anchor="middle" font-size="17" font-weight="600" fill="#1d4ed8">frontend/ (Vite)</text>
  <text x="440" y="186" text-anchor="middle" font-size="13" fill="#475569">React 19 + TypeScript</text>
  <text x="440" y="207" text-anchor="middle" font-size="13" fill="#475569">Static build → dist/</text>

  <!-- Backend -->
  <rect x="634" y="120" width="210" height="118" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="739" y="158" text-anchor="middle" font-size="17" font-weight="600" fill="#15803d">backend/ (Node)</text>
  <text x="739" y="186" text-anchor="middle" font-size="13" fill="#475569">server + api functions</text>
  <text x="739" y="207" text-anchor="middle" font-size="13" fill="#475569">redirects &amp; REST API</text>

  <!-- Data -->
  <rect x="330" y="352" width="220" height="104" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="440" y="390" text-anchor="middle" font-size="17" font-weight="600" fill="#a16207">data/links.json</text>
  <text x="440" y="416" text-anchor="middle" font-size="13" fill="#475569">Shared link registry</text>
  <text x="440" y="437" text-anchor="middle" font-size="12" fill="#475569">+ bundled seed fallback</text>

  <!-- Arrows -->
  <line x1="246" y1="160" x2="326" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="286" y="148" text-anchor="middle" font-size="12" fill="#64748b">GET /</text>

  <!-- Client → Backend arcs BELOW the frontend box so it never overlaps it -->
  <path d="M 246 200 C 330 300, 550 300, 634 200" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="230" y="286" font-size="12" fill="#64748b">POST /api/links  ·  GET /alias (302)</text>

  <!-- Backend ↔ Data -->
  <line x1="739" y1="238" x2="568" y2="360" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="686" y="316" text-anchor="middle" font-size="12" fill="#64748b">readLinks / writeLinks</text>

  <!-- Runtime hosts note -->
  <rect x="36" y="352" width="220" height="104" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="146" y="384" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Runs on 3 targets</text>
  <text x="146" y="408" text-anchor="middle" font-size="12" fill="#475569">Vite middleware (dev)</text>
  <text x="146" y="427" text-anchor="middle" font-size="12" fill="#475569">Node server (VPS)</text>
  <text x="146" y="446" text-anchor="middle" font-size="12" fill="#475569">Vercel functions</text>

  <text x="440" y="510" text-anchor="middle" font-size="13" fill="#94a3b8">One shared store keeps every runtime in sync. Frontend bundles the seed at build time.</text>
</svg>
