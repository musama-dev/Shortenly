<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="hdr2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <rect width="880" height="620" fill="#f8fafc"/>
  <rect x="0" y="0" width="880" height="64" fill="url(#hdr2)"/>
  <text x="440" y="41" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="650">Shortenly — Request Data Flow</text>

  <!-- Lane 1: create -->
  <text x="40" y="110" font-size="16" font-weight="650" fill="#1d4ed8">1 · Creating a short link</text>
  <rect x="40" y="126" width="180" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="130" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8">Dashboard</text>
  <text x="130" y="178" text-anchor="middle" font-size="12" fill="#475569">paste URL → Create</text>

  <line x1="220" y1="161" x2="296" y2="161" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="258" y="150" text-anchor="middle" font-size="11" fill="#64748b">POST /api/links</text>

  <rect x="302" y="126" width="190" height="70" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="397" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#15803d">API handler</text>
  <text x="397" y="178" text-anchor="middle" font-size="12" fill="#475569">normalize · alias check</text>

  <line x1="492" y1="161" x2="568" y2="161" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)"/>

  <rect x="574" y="126" width="160" height="70" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="654" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#a16207">links.json</text>
  <text x="654" y="178" text-anchor="middle" font-size="12" fill="#475569">link persisted</text>

  <line x1="734" y1="161" x2="786" y2="161" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)"/>
  <rect x="790" y="141" width="56" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="818" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">201</text>

  <text x="440" y="222" text-anchor="middle" font-size="12" fill="#64748b">Response: { alias, shortUrl } → UI shows https://your-domain/alias + QR code</text>

  <!-- Lane 2: redirect -->
  <text x="40" y="286" font-size="16" font-weight="650" fill="#15803d">2 · Visitor clicks a short link</text>
  <rect x="40" y="302" width="180" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="130" y="332" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8">Visitor</text>
  <text x="130" y="354" text-anchor="middle" font-size="12" fill="#475569">opens /alias</text>

  <line x1="220" y1="337" x2="296" y2="337" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="258" y="326" text-anchor="middle" font-size="11" fill="#64748b">GET /alias</text>

  <rect x="302" y="302" width="190" height="70" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="397" y="332" text-anchor="middle" font-size="14" font-weight="600" fill="#15803d">Redirect handler</text>
  <text x="397" y="354" text-anchor="middle" font-size="12" fill="#475569">lookup alias in store</text>

  <line x1="492" y1="337" x2="568" y2="337" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)"/>

  <rect x="574" y="302" width="160" height="70" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="654" y="332" text-anchor="middle" font-size="14" font-weight="600" fill="#a16207">links.json</text>
  <text x="654" y="354" text-anchor="middle" font-size="12" fill="#475569">destination found</text>

  <line x1="397" y1="372" x2="397" y2="416" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)"/>
  <rect x="286" y="420" width="222" height="52" rx="10" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  <text x="397" y="442" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">302 Location: destination</text>
  <text x="397" y="462" text-anchor="middle" font-size="11" fill="#475569">disabled alias → SPA fallback</text>

  <!-- Lane 3: SPA -->
  <text x="40" y="520" font-size="16" font-weight="650" fill="#7c3aed">3 · App routes (/#/app, …)</text>
  <rect x="40" y="534" width="806" height="56" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="443" y="558" text-anchor="middle" font-size="13" font-weight="600" fill="#7c3aed">Static host / SPA shell</text>
  <text x="443" y="578" text-anchor="middle" font-size="11" fill="#475569">unknown paths fall through to index.html — client router renders landing, dashboard, analytics, QR gallery</text>
</svg>
