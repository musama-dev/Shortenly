<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="hdr2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <rect width="880" height="620" fill="#f8fafc"/>
  <rect x="0" y="0" width="880" height="64" fill="url(#hdr2)"/>
  <text x="24" y="40" fill="#ffffff" font-size="22" font-weight="650">Shortenly — Request Data Flow</text>

  <!-- Lane: create -->
  <text x="40" y="105" font-size="15" font-weight="650" fill="#1d4ed8">① Creating a short link</text>
  <rect x="40" y="120" width="170" height="64" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="125" y="147" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">Dashboard</text>
  <text x="125" y="167" text-anchor="middle" font-size="11" fill="#475569">paste URL → Create</text>

  <line x1="210" y1="152" x2="290" y2="152" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="250" y="142" text-anchor="middle" font-size="10" fill="#64748b">POST /api/links</text>

  <rect x="296" y="120" width="180" height="64" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="386" y="147" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">API handler</text>
  <text x="386" y="167" text-anchor="middle" font-size="11" fill="#475569">normalize · alias check</text>

  <line x1="476" y1="152" x2="556" y2="152" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)"/>

  <rect x="562" y="120" width="150" height="64" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="637" y="147" text-anchor="middle" font-size="13" font-weight="600" fill="#a16207">links.json</text>
  <text x="637" y="167" text-anchor="middle" font-size="11" fill="#475569">link persisted</text>

  <line x1="712" y1="152" x2="780" y2="152" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)"/>
  <rect x="784" y="132" width="72" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="820" y="157" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">201</text>
  <text x="500" y="210" font-size="11" fill="#64748b">Response: { alias, shortUrl } → UI shows https://your-domain/alias + QR code</text>

  <!-- Lane: redirect -->
  <text x="40" y="275" font-size="15" font-weight="650" fill="#15803d">② Visitor clicks a short link</text>
  <rect x="40" y="290" width="170" height="64" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="125" y="317" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">Visitor</text>
  <text x="125" y="337" text-anchor="middle" font-size="11" fill="#475569">opens /alias</text>

  <line x1="210" y1="322" x2="290" y2="322" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="250" y="312" text-anchor="middle" font-size="10" fill="#64748b">GET /alias</text>

  <rect x="296" y="290" width="180" height="64" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="386" y="317" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">Redirect handler</text>
  <text x="386" y="337" text-anchor="middle" font-size="11" fill="#475569">lookup alias in store</text>

  <line x1="476" y1="322" x2="556" y2="322" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)"/>

  <rect x="562" y="290" width="150" height="64" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="637" y="317" text-anchor="middle" font-size="13" font-weight="600" fill="#a16207">links.json</text>
  <text x="637" y="337" text-anchor="middle" font-size="11" fill="#475569">destination found</text>

  <line x1="476" y1="354" x2="476" y2="400" stroke="#64748b" stroke-width="2" marker-end="url(#arr2)"/>
  <rect x="380" y="404" width="192" height="46" rx="10" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  <text x="476" y="424" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">302 Location: destination</text>
  <text x="476" y="442" text-anchor="middle" font-size="10" fill="#475569">disabled alias → SPA fallback</text>

  <!-- Lane: SPA -->
  <text x="40" y="500" font-size="15" font-weight="650" fill="#7c3aed">③ App routes (/#/app, …)</text>
  <rect x="40" y="515" width="744" height="64" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="412" y="542" text-anchor="middle" font-size="13" font-weight="600" fill="#7c3aed">Static host / SPA shell</text>
  <text x="412" y="562" text-anchor="middle" font-size="11" fill="#475569">unknown paths fall through to index.html — client router renders landing, dashboard, analytics, QR gallery</text>

  <text x="440" y="606" text-anchor="middle" font-size="11" fill="#94a3b8">Three request paths: create · redirect · SPA shell</text>
</svg>
